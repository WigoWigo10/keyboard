name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/ruff-action@v3
        with:
          # Pinned to match .pre-commit-config.yaml. Without this the action
          # installs its own latest Ruff, whose formatter can disagree with the
          # one contributors run locally, failing CI on correctly formatted code.
          version: 0.16.1

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux backend only touches /dev/input from init(), so the suite
        # imports and runs unprivileged against the fake backend, as on Windows.
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        # testpaths and norecursedirs come from pyproject.toml.
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
